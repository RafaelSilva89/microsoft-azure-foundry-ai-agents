<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1112" viewBox="0 0 1400 1112" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">Agente analista de dados · Foundry Agent Service + Code Interpreter</title>
<desc id="d">O notebook code_interpreter.ipynb envia o arquivo electronics_products.csv ao projeto Foundry (files.create, purpose assistants) e cria o agente code-interpreter-agent com a ferramenta CodeInterpreterTool e o file_id do CSV. A pergunta pede um gráfico de colunas; o agente escreve código pandas e matplotlib, executa em um container sandbox e gera um PNG. O notebook lê a anotação container_file_citation da resposta e baixa a imagem com containers.files.content.retrieve.</desc>
