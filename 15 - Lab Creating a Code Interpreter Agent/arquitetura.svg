<text x="40" y="866" font-size="15" fill="#243A5E" text-anchor="start" font-weight="bold">Passo a passo</text>
<circle cx="52" cy="887" r="11" fill="#8661C5"/>
<text x="52" y="892" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="72" y="892" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Autenticação:</tspan> DefaultAzureCredential obtém o token no Entra ID.</text>
<circle cx="52" cy="917" r="11" fill="#C19C00"/>
<text x="52" y="922" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="72" y="922" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Upload do CSV:</tspan> openai_client.files.create envia electronics_products.csv ao projeto e devolve o file_id.</text>
<circle cx="52" cy="947" r="11" fill="#0078D4"/>
<text x="52" y="952" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="72" y="952" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Cria o agente:</tspan> create_version com CodeInterpreterTool(container=CodeInterpreterToolAuto(file_ids=[file.id])).</text>
<circle cx="52" cy="977" r="11" fill="#107C10"/>
<text x="52" y="982" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="72" y="982" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Cria a conversa:</tspan> conversations.create devolve o conversation.id.</text>
<circle cx="52" cy="1007" r="11" fill="#243A5E"/>
<text x="52" y="1012" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="72" y="1012" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Pede o gráfico:</tspan> responses.create: &quot;crie um gráfico de colunas com produtos no eixo x e preços no eixo y&quot;.</text>
<circle cx="52" cy="1037" r="11" fill="#B4009E"/>
<text x="52" y="1042" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
<text x="72" y="1042" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Executa Python:</tspan> o agente escreve o código, roda na sandbox (lê o CSV, plota) e salva o PNG no container.</text>
<circle cx="52" cy="1067" r="11" fill="#C19C00"/>
<text x="52" y="1072" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text>
<text x="72" y="1072" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Baixa o gráfico:</tspan> a anotação container_file_citation traz file_id + container_id; containers.files.content baixa o PNG.</text>
