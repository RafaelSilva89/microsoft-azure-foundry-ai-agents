<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="419" viewBox="0 0 1200 419" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">Como o agente usa a busca na web</title>
<desc id="d">Fluxo: a pergunta sobre energia renovável chega ao agente, que analisa a intenção e percebe que precisa de dados atuais; chama a ferramenta Web Search; recebe páginas com URLs; o modelo resume e responde com os links.</desc>
<defs>
<marker id="aAz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker>
<marker id="aNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#243A5E"/></marker>
<marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#107C10"/></marker>
<marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8661C5"/></marker>
<marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CA5010"/></marker>
<marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#038387"/></marker>
<marker id="aGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C19C00"/></marker>
<marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
<marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D13438"/></marker>
<marker id="aMagenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4009E"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="419" fill="#FFFFFF"/>
<text x="600" y="34" font-size="20" fill="#243A5E" text-anchor="middle" font-weight="bold">Como o agente usa a busca na web</text>
<text x="600" y="58" font-size="14" fill="#505050" text-anchor="middle">O modelo sozinho só conhece o que aprendeu no treinamento. A ferramenta Web Search traz informação de hoje.</text>
<rect x="40" y="78" width="1120" height="50" rx="25" fill="#EAF5EA" stroke="#107C10" stroke-width="1.6"/>
<text x="64" y="109" font-size="14" fill="#107C10" text-anchor="start" font-weight="bold">Pergunta:</text>
<text x="140" y="109" font-size="14" fill="#243A5E" text-anchor="start" font-style="italic">&quot;Quais são os avanços mais recentes em energia renovável?&quot;</text>
<rect x="40.0" y="160.0" width="196.8" height="147.0" rx="8" fill="#E8F1FB" stroke="#0078D4" stroke-width="2"/>
<circle cx="62.0" cy="182.0" r="12" fill="#0078D4"/>
<text x="62.0" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="148.4" y="187.0" font-size="14" fill="#0078D4" text-anchor="middle" font-weight="bold">Agente recebe</text>
<text x="138.4" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">a pergunta chega ao</text>
<text x="138.4" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">web-search-agent</text>
<text x="138.4" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">(sem mencionar</text>
<text x="138.4" y="269.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">a ferramenta)</text>
<line x1="238.8" y1="233.5" x2="268.8" y2="233.5" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="270.8" y="160.0" width="196.8" height="147.0" rx="8" fill="#EEF1F6" stroke="#243A5E" stroke-width="2"/>
<circle cx="292.8" cy="182.0" r="12" fill="#243A5E"/>
<text x="292.8" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="379.20000000000005" y="187.0" font-size="14" fill="#243A5E" text-anchor="middle" font-weight="bold">Analisa a intenção</text>
<text x="369.20000000000005" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">&quot;preciso de dados</text>
<text x="369.20000000000005" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">atuais?&quot; → sim</text>
<text x="369.20000000000005" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">olha as ferramentas</text>
<text x="369.20000000000005" y="269.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">que ele possui</text>
<line x1="469.6" y1="233.5" x2="499.6" y2="233.5" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="501.6" y="160.0" width="196.8" height="147.0" rx="8" fill="#E6F4F4" stroke="#038387" stroke-width="2"/>
<circle cx="523.6" cy="182.0" r="12" fill="#038387"/>
<text x="523.6" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="610.0" y="187.0" font-size="14" fill="#038387" text-anchor="middle" font-weight="bold">Web Search</text>
<text x="600.0" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">busca na internet</text>
<text x="600.0" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">consulta: &quot;últimos</text>
<text x="600.0" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">avanços em energia</text>
<text x="600.0" y="269.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">renovável 2025&quot;</text>
<line x1="700.4000000000001" y1="233.5" x2="730.4000000000001" y2="233.5" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="732.4000000000001" y="160.0" width="196.8" height="147.0" rx="8" fill="#FFF8E6" stroke="#C19C00" stroke-width="2"/>
<circle cx="754.4000000000001" cy="182.0" r="12" fill="#C19C00"/>
<text x="754.4000000000001" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="840.8000000000001" y="187.0" font-size="14" fill="#8A6D00" text-anchor="middle" font-weight="bold">Resultados</text>
<text x="830.8000000000001" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">trechos de páginas</text>
<text x="830.8000000000001" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">+ URL e título</text>
<text x="830.8000000000001" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">(url_citation)</text>
<line x1="931.2" y1="233.5" x2="961.2" y2="233.5" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="963.2" y="160.0" width="196.8" height="147.0" rx="8" fill="#EAF5EA" stroke="#107C10" stroke-width="2"/>
<circle cx="985.2" cy="182.0" r="12" fill="#107C10"/>
<text x="985.2" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="1071.6000000000001" y="187.0" font-size="14" fill="#107C10" text-anchor="middle" font-weight="bold">Resposta</text>
<text x="1061.6000000000001" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">resumo: painéis</text>
<text x="1061.6000000000001" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">bifaciais, fotovoltaica</text>
<text x="1061.6000000000001" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">de baixo custo…</text>
<text x="1061.6000000000001" y="269.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">com links das fontes</text>
<rect x="40" y="333" width="1120" height="70" rx="8" fill="#FFF4EC" stroke="#CA5010" stroke-width="1.6"/>
<text x="60" y="357" font-size="13" fill="#CA5010" text-anchor="start" font-weight="bold">Por que isso importa</text>
<text x="60" y="377" font-size="13" fill="#3B3B3B" text-anchor="start">A resposta fica atual e verificável (cada afirmação tem um link). Em troca, os textos das páginas entram no prompt: ≈ 7.254 tokens na demonstração.</text>
</svg>
