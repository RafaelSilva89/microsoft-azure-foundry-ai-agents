<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">Como o conversation.id dá memória ao agente</title>
<desc id="d">Sem conversa, cada pergunta chega sozinha e o agente não sabe o nome do usuário. Com a conversa, as mensagens anteriores ficam guardadas no conversation.id e são enviadas junto com a nova pergunta, então o agente lembra o nome. O custo é que os tokens crescem a cada mensagem: 139 tokens na primeira chamada e 219 no total da conversa.</desc>
<defs>
  <marker id="mDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#243A5E"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="560" fill="#FFFFFF"/>

<text x="600" y="34" font-size="20" font-weight="bold" fill="#243A5E" text-anchor="middle">Por que o agente "lembra" do que eu disse?</text>
<text x="600" y="58" font-size="14" fill="#505050" text-anchor="middle">O modelo não tem memória própria. Quem guarda o histórico é a conversa (conversation.id).</text>

<!-- ===== sem conversa ===== -->
<rect x="20" y="84" width="560" height="380" rx="8" fill="#FDF3F4" stroke="#D13438" stroke-width="1.8"/>
<text x="300" y="112" font-size="16" font-weight="bold" fill="#D13438" text-anchor="middle">Sem conversa: cada pergunta chega sozinha</text>

<rect x="44" y="134" width="300" height="40" rx="18" fill="#EAF5EA" stroke="#107C10"/>
<text x="60" y="159" font-size="13.5" fill="#243A5E">Você: "Meu nome é Kuljot."</text>
<rect x="236" y="186" width="320" height="40" rx="18" fill="#F4F4F4" stroke="#7A7A7A"/>
<text x="252" y="211" font-size="13.5" fill="#243A5E">Batman: "Gotham agradece, Kuljot."</text>

<line x1="40" y1="250" x2="560" y2="250" stroke="#D13438" stroke-dasharray="6,5"/>
<text x="300" y="270" font-size="12.5" fill="#D13438" text-anchor="middle">nova chamada, sem histórico: o modelo começa do zero</text>

<rect x="44" y="290" width="300" height="40" rx="18" fill="#EAF5EA" stroke="#107C10"/>
<text x="60" y="315" font-size="13.5" fill="#243A5E">Você: "Qual era o meu nome?"</text>
<rect x="236" y="342" width="320" height="40" rx="18" fill="#F4F4F4" stroke="#7A7A7A"/>
<text x="252" y="367" font-size="13.5" fill="#243A5E">Batman: "Não sei quem você é."</text>
<text x="300" y="420" font-size="40" fill="#D13438" text-anchor="middle">✗</text>
<text x="300" y="450" font-size="13" fill="#505050" text-anchor="middle">o agente responde, mas esquece tudo entre as mensagens</text>

<!-- ===== com conversa ===== -->
<rect x="620" y="84" width="560" height="380" rx="8" fill="#F1F8F1" stroke="#107C10" stroke-width="1.8"/>
<text x="900" y="112" font-size="16" font-weight="bold" fill="#107C10" text-anchor="middle">Com conversa: o histórico vai junto</text>

<rect x="644" y="130" width="512" height="182" rx="8" fill="#FFFFFF" stroke="#107C10" stroke-dasharray="6,4"/>
<text x="660" y="152" font-size="13" font-weight="bold" fill="#107C10">conversation.id = "conv_…"   (guardado no Foundry)</text>
<rect x="660" y="164" width="300" height="32" rx="15" fill="#EAF5EA"/>
<text x="674" y="185" font-size="13" fill="#243A5E">Você: "Meu nome é Kuljot."</text>
<rect x="840" y="202" width="300" height="32" rx="15" fill="#F4F4F4"/>
<text x="854" y="223" font-size="13" fill="#243A5E">Batman: "Gotham agradece, Kuljot."</text>
<rect x="660" y="240" width="300" height="32" rx="15" fill="#EAF5EA"/>
<text x="674" y="261" font-size="13" fill="#243A5E">Você: "Qual era o meu nome?"</text>
<text x="1140" y="300" font-size="11.5" fill="#505050" text-anchor="end">tudo isso é enviado ao modelo</text>

<line x1="900" y1="314" x2="900" y2="342" stroke="#243A5E" stroke-width="2" marker-end="url(#mDark)"/>
<rect x="760" y="344" width="380" height="40" rx="18" fill="#F4F4F4" stroke="#7A7A7A"/>
<text x="776" y="369" font-size="13.5" fill="#243A5E">Batman: "Você disse que se chama Kuljot."</text>
<text x="900" y="420" font-size="40" fill="#107C10" text-anchor="middle">✓</text>
<text x="900" y="450" font-size="13" fill="#505050" text-anchor="middle">mesma conversation.id em todas as chamadas = memória</text>

<!-- ===== custo ===== -->
<rect x="20" y="482" width="1160" height="62" rx="8" fill="#FFF4EC" stroke="#CA5010"/>
<text x="40" y="508" font-size="14" font-weight="bold" fill="#CA5010">O preço da memória: mais tokens a cada mensagem</text>
<rect x="40" y="518" width="290" height="16" rx="3" fill="#F7C9A8"/>
<text x="338" y="531" font-size="12.5" fill="#3B3B3B">1ª chamada: 139 tokens</text>
<rect x="500" y="518" width="456" height="16" rx="3" fill="#CA5010"/>
<text x="964" y="531" font-size="12.5" fill="#3B3B3B">conversa completa: 219 tokens</text>
</svg>
