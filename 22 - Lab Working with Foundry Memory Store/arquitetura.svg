<text x="52" y="892" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="72" y="892" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Autenticação:</tspan> DefaultAzureCredential no Entra ID; o projeto precisa da função Azure AI User para usar os modelos.</text>
<circle cx="52" cy="917" r="11" fill="#038387"/>
<text x="52" y="922" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="72" y="922" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Guarda memórias:</tspan> memory_stores.create e begin_update_memories(scope=usuário): o LLM extrai os fatos e o embedding vetoriza.</text>
<circle cx="52" cy="947" r="11" fill="#0078D4"/>
<text x="52" y="952" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="72" y="952" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Cria o agente:</tspan> create_version do helpful-assistant-agent (GPT-4.1, sem ferramentas).</text>
<circle cx="52" cy="977" r="11" fill="#038387"/>
<text x="52" y="982" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="72" y="982" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Busca memórias:</tspan> search_memories com a pergunta e max_memories=5 devolve os fatos mais parecidos daquele usuário.</text>
<circle cx="52" cy="1007" r="11" fill="#243A5E"/>
<text x="52" y="1012" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="72" y="1012" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Pergunta + contexto:</tspan> a pergunta recebe as linhas &quot;Memory Context: …&quot; e vai ao agente com responses.create.</text>
<circle cx="52" cy="1037" r="11" fill="#243A5E"/>
<text x="52" y="1042" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
<text x="72" y="1042" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Resposta personalizada:</tspan> ex.: receitas sem amendoim e sem laticínios, código em Python, qualidades do Batman.</text>
