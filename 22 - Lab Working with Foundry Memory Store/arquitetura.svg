<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1082" viewBox="0 0 1400 1082" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">Assistente com memória de longo prazo · Foundry Memory Store</title>
<desc id="d">O notebook memories.ipynb cria o memory store demo_memory_store_v1 com MemoryStoreDefaultDefinition (chat_model GPT-4.1, embedding_model text-embedding-3-small, perfil do usuário e resumo de chat ativos). A função update_memory_store envia a mensagem do usuário com begin_update_memories no escopo do nome do usuário; o LLM extrai os fatos e o modelo de embedding gera os vetores. No chat, cada pergunta passa por search_memories (até 5 memórias), as memórias encontradas são anexadas ao texto como Memory Context e o helpful-assistant-agent responde de forma personalizada. A identidade do projeto precisa da função Azure AI User no grupo de recursos.</desc>
