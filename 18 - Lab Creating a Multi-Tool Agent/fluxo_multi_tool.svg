<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="476" viewBox="0 0 1200 476" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">Como o agente usa mais de uma ferramenta na mesma pergunta</title>
<desc id="d">Fluxo: a pergunta dupla chega; o agente divide em duas tarefas; para o módulo do Learn usa o servidor MCP (docs search); para o clima usa a ferramenta OpenAPI (GetCurrentWeather em Seattle); combina os resultados em uma resposta.</desc>
<defs>
<marker id="aAz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker>
<marker id="aNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#243A5E"/></marker>
<marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#107C10"/></marker>
<marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8661C5"/></marker>
<marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CA5010"/></marker>
<marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#038387"/></marker>
<marker id="aGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C19C00"/></marker>
<marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
<marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D13438"/></marker>
<marker id="aMagenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4009E"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="476" fill="#FFFFFF"/>
<text x="600" y="34" font-size="20" fill="#243A5E" text-anchor="middle" font-weight="bold">Como o agente usa mais de uma ferramenta na mesma pergunta</text>
<text x="600" y="58" font-size="14" fill="#505050" text-anchor="middle">O agente tem um orquestrador interno: entende que a pergunta tem duas partes e monta um plano de execução.</text>
<rect x="40" y="78" width="1120" height="50" rx="25" fill="#EAF5EA" stroke="#107C10" stroke-width="1.6"/>
<text x="64" y="109" font-size="14" fill="#107C10" text-anchor="start" font-weight="bold">Pergunta:</text>
<text x="140" y="109" font-size="14" fill="#243A5E" text-anchor="start" font-style="italic">&quot;Qual o clima em Seattle? E encontre um módulo do Microsoft Learn sobre o Microsoft Foundry.&quot;</text>
<rect x="40.0" y="160.0" width="196.8" height="204.0" rx="8" fill="#EEF1F6" stroke="#243A5E" stroke-width="2"/>
<circle cx="62.0" cy="182.0" r="12" fill="#243A5E"/>
<text x="62.0" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="148.4" y="187.0" font-size="14" fill="#243A5E" text-anchor="middle" font-weight="bold">Planeja</text>
<text x="138.4" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">a pergunta tem</text>
<text x="138.4" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">2 partes →</text>
<text x="138.4" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">2 tarefas,</text>
<text x="138.4" y="269.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">1 ferramenta cada</text>
<line x1="238.8" y1="262.0" x2="268.8" y2="262.0" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="270.8" y="160.0" width="196.8" height="96.0" rx="8" fill="#FBEAF8" stroke="#B4009E" stroke-width="2"/>
<circle cx="292.8" cy="182.0" r="12" fill="#B4009E"/>
<text x="292.8" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="379.20000000000005" y="187.0" font-size="14" fill="#B4009E" text-anchor="middle" font-weight="bold">Tarefa A · MCP</text>
<text x="369.20000000000005" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">lista as tools</text>
<text x="369.20000000000005" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">→ docs_search</text>
<rect x="270.8" y="268.0" width="196.8" height="96.0" rx="8" fill="#EAF5EA" stroke="#107C10" stroke-width="2"/>
<circle cx="292.8" cy="290.0" r="12" fill="#107C10"/>
<text x="292.8" y="295.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="379.20000000000005" y="295.0" font-size="14" fill="#107C10" text-anchor="middle" font-weight="bold">Tarefa B · OpenAPI</text>
<text x="369.20000000000005" y="320.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">GetCurrentWeather</text>
<text x="369.20000000000005" y="339.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">location = Seattle</text>
<line x1="469.6" y1="262.0" x2="499.6" y2="262.0" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="501.6" y="160.0" width="196.8" height="96.0" rx="8" fill="#E6F4F4" stroke="#038387" stroke-width="2"/>
<text x="600.0" y="187.0" font-size="14" fill="#038387" text-anchor="middle" font-weight="bold">Microsoft Learn</text>
<text x="600.0" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">módulo &quot;What is</text>
<text x="600.0" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">Microsoft Foundry&quot;</text>
<rect x="501.6" y="268.0" width="196.8" height="96.0" rx="8" fill="#E6F4F4" stroke="#038387" stroke-width="2"/>
<text x="600.0" y="295.0" font-size="14" fill="#038387" text-anchor="middle" font-weight="bold">wttr.in</text>
<text x="600.0" y="320.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">7 °C, nublado</text>
<text x="600.0" y="339.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">umidade 82%</text>
<line x1="700.4000000000001" y1="262.0" x2="730.4000000000001" y2="262.0" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="732.4000000000001" y="160.0" width="196.8" height="204.0" rx="8" fill="#E8F1FB" stroke="#0078D4" stroke-width="2"/>
<circle cx="754.4000000000001" cy="182.0" r="12" fill="#0078D4"/>
<text x="754.4000000000001" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="840.8000000000001" y="187.0" font-size="14" fill="#0078D4" text-anchor="middle" font-weight="bold">Combina</text>
<text x="830.8000000000001" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">junta os dois</text>
<text x="830.8000000000001" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">resultados em</text>
<text x="830.8000000000001" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">um texto só</text>
<line x1="931.2" y1="262.0" x2="961.2" y2="262.0" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="963.2" y="160.0" width="196.8" height="204.0" rx="8" fill="#EAF5EA" stroke="#107C10" stroke-width="2"/>
<circle cx="985.2" cy="182.0" r="12" fill="#107C10"/>
<text x="985.2" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="1071.6000000000001" y="187.0" font-size="14" fill="#107C10" text-anchor="middle" font-weight="bold">Resposta</text>
<text x="1061.6000000000001" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">clima de Seattle</text>
<text x="1061.6000000000001" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">+ link do módulo</text>
<text x="1061.6000000000001" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">no Microsoft Learn</text>
<rect x="40" y="390" width="1120" height="70" rx="8" fill="#FFF4EC" stroke="#CA5010" stroke-width="1.6"/>
<text x="60" y="414" font-size="13" fill="#CA5010" text-anchor="start" font-weight="bold">Por que isso importa</text>
<text x="60" y="434" font-size="13" fill="#3B3B3B" text-anchor="start">O mesmo agente atende pedidos diferentes sem regras fixas no código: ele decide quais ferramentas usar, em que ordem, e combina os resultados.</text>
</svg>
