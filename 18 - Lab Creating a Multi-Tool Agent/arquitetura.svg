<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1334" viewBox="0 0 1400 1334" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">Agente multiferramenta · Foundry Agent Service + MCP + OpenAPI</title>
<desc id="d">O notebook run.ipynb monta duas ferramentas: a OpenAPI weather (weather_openapi.json, API wttr.in) e o MCPTool do Microsoft Learn (conexão encontrada por MCP_SERVER_NAME). Cria o multi-tool-agent com tools=[weather_tool, mcp_tool] e pergunta o clima de Seattle e um módulo do Microsoft Learn sobre o Microsoft Foundry. O orquestrador interno do agente planeja a execução: lista as ferramentas do MCP, chama microsoft_docs_search e chama GetCurrentWeather. O tracing mostra as duas chamadas e cerca de 17 mil tokens.</desc>
