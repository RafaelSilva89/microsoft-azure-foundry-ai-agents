<circle cx="52" cy="1139" r="11" fill="#107C10"/>
<text x="52" y="1144" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="72" y="1144" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Cria a conversa:</tspan> conversations.create devolve o conversation.id.</text>
<circle cx="52" cy="1169" r="11" fill="#243A5E"/>
<text x="52" y="1174" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="72" y="1174" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Pergunta:</tspan> &quot;Como está o tempo em Nova York hoje?&quot; via responses.create com agent_reference.</text>
<circle cx="52" cy="1199" r="11" fill="#0078D4"/>
<text x="52" y="1204" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">6</text>
<text x="72" y="1204" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Escolhe a operação:</tspan> pelas descrições da spec, o agente decide chamar GetCurrentWeather com location = New York.</text>
<circle cx="52" cy="1229" r="11" fill="#107C10"/>
<text x="52" y="1234" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">7</text>
<text x="72" y="1234" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Chama a API:</tspan> GET wttr.in/New York?format=j1 devolve um JSON grande com as condições atuais.</text>
<circle cx="52" cy="1259" r="11" fill="#243A5E"/>
<text x="52" y="1264" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">8</text>
<text x="72" y="1264" font-size="13.5" fill="#3B3B3B"><tspan font-weight="bold">Resume:</tspan> o GPT-4 transforma o JSON em uma resposta clara (temperatura, sensação, vento, nascer/pôr do sol).</text>
