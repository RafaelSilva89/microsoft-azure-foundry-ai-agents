<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1304" viewBox="0 0 1400 1304" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">Agente do clima · Foundry Agent Service + ferramenta OpenAPI</title>
<desc id="d">O notebook openapi.ipynb lê o arquivo weather_openapi.json com jsonref e monta a ferramenta do tipo openapi (nome weather, autenticação anonymous). Cria o agente weather-agent com essa ferramenta, cria a conversa e pergunta o clima de Nova York. O agente lê a especificação, escolhe a operação GetCurrentWeather (GET /{location}?format=j1), chama a API pública wttr.in e resume o JSON. O tracing mostra a chamada remota e cerca de 11.026 tokens, inflados pela resposta grande da API.</desc>
