<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="419" viewBox="0 0 1200 419" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
<title id="t">Como o agente usa um navegador de verdade</title>
<desc id="d">Fluxo: a tarefa com instruções passo a passo chega; o agente aciona a automação de navegador; o navegador do Playwright Workspace abre finance.yahoo.com, pesquisa MSFT, clica em YTD e lê o percentual; o agente responde 14,3%.</desc>
<defs>
<marker id="aAz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0078D4"/></marker>
<marker id="aNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#243A5E"/></marker>
<marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#107C10"/></marker>
<marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8661C5"/></marker>
<marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CA5010"/></marker>
<marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#038387"/></marker>
<marker id="aGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C19C00"/></marker>
<marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker>
<marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D13438"/></marker>
<marker id="aMagenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4009E"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="419" fill="#FFFFFF"/>
<text x="600" y="34" font-size="20" fill="#243A5E" text-anchor="middle" font-weight="bold">Como o agente usa um navegador de verdade</text>
<text x="600" y="58" font-size="14" fill="#505050" text-anchor="middle">Em vez de chamar uma API, o agente controla um navegador remoto: abre o site, digita, clica e lê a tela, como uma pessoa faria.</text>
<rect x="40" y="78" width="1120" height="50" rx="25" fill="#EAF5EA" stroke="#107C10" stroke-width="1.6"/>
<text x="64" y="109" font-size="14" fill="#107C10" text-anchor="start" font-weight="bold">Pergunta:</text>
<text x="140" y="109" font-size="14" fill="#243A5E" text-anchor="start" font-style="italic">&quot;Abra finance.yahoo.com, pesquise MSFT, clique em YTD e informe a variação percentual&quot;</text>
<rect x="40.0" y="160.0" width="196.8" height="147.0" rx="8" fill="#EEF1F6" stroke="#243A5E" stroke-width="2"/>
<circle cx="62.0" cy="182.0" r="12" fill="#243A5E"/>
<text x="62.0" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text>
<text x="148.4" y="187.0" font-size="14" fill="#243A5E" text-anchor="middle" font-weight="bold">Agente lê a tarefa</text>
<text x="138.4" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">instruções bem</text>
<text x="138.4" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">detalhadas: site,</text>
<text x="138.4" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">campo de busca,</text>
<text x="138.4" y="269.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">botão YTD</text>
<line x1="238.8" y1="233.5" x2="268.8" y2="233.5" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="270.8" y="160.0" width="196.8" height="147.0" rx="8" fill="#FDF3F4" stroke="#D13438" stroke-width="2"/>
<circle cx="292.8" cy="182.0" r="12" fill="#D13438"/>
<text x="292.8" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text>
<text x="379.20000000000005" y="187.0" font-size="14" fill="#D13438" text-anchor="middle" font-weight="bold">Abre o navegador</text>
<text x="369.20000000000005" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">Azure Playwright</text>
<text x="369.20000000000005" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">Workspace cria um</text>
<text x="369.20000000000005" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">navegador isolado</text>
<text x="369.20000000000005" y="269.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">(sandbox)</text>
<line x1="469.6" y1="233.5" x2="499.6" y2="233.5" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="501.6" y="160.0" width="196.8" height="147.0" rx="8" fill="#FDF3F4" stroke="#D13438" stroke-width="2"/>
<circle cx="523.6" cy="182.0" r="12" fill="#D13438"/>
<text x="523.6" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text>
<text x="610.0" y="187.0" font-size="14" fill="#D13438" text-anchor="middle" font-weight="bold">Navega</text>
<text x="600.0" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">finance.yahoo.com</text>
<text x="600.0" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">digita &quot;MSFT&quot;</text>
<text x="600.0" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">abre o gráfico</text>
<text x="600.0" y="269.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">clica em &quot;YTD&quot;</text>
<line x1="700.4000000000001" y1="233.5" x2="730.4000000000001" y2="233.5" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="732.4000000000001" y="160.0" width="196.8" height="147.0" rx="8" fill="#FFF8E6" stroke="#C19C00" stroke-width="2"/>
<circle cx="754.4000000000001" cy="182.0" r="12" fill="#C19C00"/>
<text x="754.4000000000001" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text>
<text x="840.8000000000001" y="187.0" font-size="14" fill="#8A6D00" text-anchor="middle" font-weight="bold">Lê a tela</text>
<text x="830.8000000000001" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">percentual logo</text>
<text x="830.8000000000001" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">abaixo do gráfico</text>
<text x="830.8000000000001" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">(1ª tentativa falhou,</text>
<text x="830.8000000000001" y="269.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">a 2ª encontrou)</text>
<line x1="931.2" y1="233.5" x2="961.2" y2="233.5" stroke="#243A5E" stroke-width="2.2" marker-end="url(#aNavy)"/>
<rect x="963.2" y="160.0" width="196.8" height="147.0" rx="8" fill="#EAF5EA" stroke="#107C10" stroke-width="2"/>
<circle cx="985.2" cy="182.0" r="12" fill="#107C10"/>
<text x="985.2" y="187.0" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text>
<text x="1071.6000000000001" y="187.0" font-size="14" fill="#107C10" text-anchor="middle" font-weight="bold">Resposta</text>
<text x="1061.6000000000001" y="212.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">&quot;variação YTD</text>
<text x="1061.6000000000001" y="231.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">das ações da</text>
<text x="1061.6000000000001" y="250.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">Microsoft: 14,3%&quot;</text>
<text x="1061.6000000000001" y="269.0" font-size="12.5" fill="#3B3B3B" text-anchor="middle">(após 2 a 3 min)</text>
<rect x="40" y="333" width="1120" height="70" rx="8" fill="#FDF3F4" stroke="#D13438" stroke-width="1.6"/>
<text x="60" y="357" font-size="13" fill="#D13438" text-anchor="start" font-weight="bold">Limitações observadas na aula</text>
<text x="60" y="377" font-size="13" fill="#3B3B3B" text-anchor="start">Lento (minutos por tarefa), sensível à forma do pedido e bloqueado por Cloudflare/CAPTCHA em alguns sites (ex.: Udemy). Ideal para tarefas longas em segundo plano.</text>
</svg>
